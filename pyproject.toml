[project]
name = "nanatau-motionpngtuber-tools"
version = "0.1.0"
description = "MotionPNGTuber toolchain for the nanatau repository"
readme = ".claude/skills/motion-pngtuber-nanatau/README.md"
requires-python = "==3.10.*"
# ML toolchain deps (torch/mmdet/mmpose/anime-face-detector) are intentionally undeclared; they are installed separately via mim (see .claude/skills/motion-pngtuber-nanatau/README.md).
dependencies = [
    "numpy>=1.24.0,<3.0.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "scipy>=1.10.0",
    "tqdm>=4.66.0",
]

[tool.uv]
override-dependencies = [
    "opencv-python-headless>=4.5.4.58 ; sys_platform == 'never'",
]
